---
- name: Analizar log de FileZilla y bloquear IPs con más de 5 intentos fallidos del día más reciente
  hosts: WinFTP
  gather_facts: false

  tasks:
    - name: Leer y filtrar líneas del log del día más reciente con error 530
      win_shell: |
        $logFile = "C:\xampp\FileZillaFTP\Logs\FileZilla Server.log"

        # Obtener solo líneas con error 530
        $lines = Get-Content $logFile | Select-String "530 Login or password incorrect!"
        if ($lines.Count -eq 0) { exit 0 }

        # Extraer solo fechas de esas líneas (dd/mm/yyyy)
        $dates = $lines | ForEach-Object {
            if ($_ -match '(\d{2}/\d{2}/\d{4})') { $matches[1] }
        } | Sort-Object -Descending

        if ($dates.Count -eq 0) { exit 0 }

        # Tomar la fecha más reciente
        $latestDate = $dates[0]

        # Filtrar líneas que coincidan con la fecha más reciente
        $lines | Where-Object { $_ -match $latestDate } | ForEach-Object {
            # Extraer la IP
            if ($_ -match '\((\d{1,3}(\.\d{1,3}){3})\)') { $matches[1] }
        } | Group-Object | Where-Object { $_.Count -gt 5 } | ForEach-Object { $_.Name }
      register: ips_validas

    - name: Mostrar IPs válidas a bloquear
      debug:
        var: ips_validas.stdout_lines

    - name: Bloquear IP usando comando PowerShell
      win_shell: |
        New-NetFirewallRule `
          -DisplayName "Block-FTP-HighAttempts-{{ item }}" `
          -Direction Inbound `
          -Action Block `
          -RemoteAddress {{ item }} `
          -Protocol Any
      loop: "{{ ips_validas.stdout_lines }}"